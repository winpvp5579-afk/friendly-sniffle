<!DOCTYPE html>
<html>
<body>
    <h1>หน้าเว็บรับโดเนท</h1>
    <input type="text" id="name" placeholder="ชื่อของคุณ"><br>
    <input type="text" id="message" placeholder="ข้อความ"><br>
    <input type="file" id="slip"><br>
    <button onclick="submitSlip()">ส่งสลิปโดเนท</button>

    <script>
        async function submitSlip() {
            const file = document.getElementById('slip').files[0];
            const reader = new FileReader();
            reader.onload = async (e) => {
                const response = await fetch('/verify-slip', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        imageRaw: e.target.result.split(',')[1], 
                        name: document.getElementById('name').value,
                        message: document.getElementById('message').value
                    })
                });
                alert(await response.text());
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
